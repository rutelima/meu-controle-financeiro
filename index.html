<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nosso Dinheiro 💚</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Nosso Dinheiro 💚</h1>
    <p>Resumo financeiro do casal</p>
  </header>

  <main class="container">
    <section class="card form-card">
      <h2>Adicionar Transação</h2>
      <form id="form-transacao">
        <div class="input-group">
          <label for="descricao">Descrição:</label>
          <input type="text" id="descricao" placeholder="Ex: Mercado, Salário..." required>
        </div>
        <div class="input-group">
          <label for="valor">Valor (R$):</label>
          <input type="number" id="valor" step="0.01" placeholder="0,00" required>
        </div>
        <div class="input-group">
          <label for="tipo">Tipo:</label>
          <select id="tipo">
            <option value="entrada">Entrada</option>
            <option value="despesa">Despesa</option>
            <option value="investimento">Investimento</option>
          </select>
        </div>
        <button type="submit" class="btn">Adicionar</button>
      </form>
    </section>

    <section class="cards-resumo">
      <div class="card saldo-card">
        <h3>Entradas</h3>
        <p id="total-entradas" class="valor positivo">R$ 0,00</p>
      </div>
      <div class="card saldo-card">
        <h3>Despesas</h3>
        <p id="total-despesas" class="valor negativo">R$ 0,00</p>
      </div>
      <div class="card saldo-card saldo-destaque">
        <h3>Saldo restante</h3>
        <p id="saldo-total" class="valor">R$ 0,00</p>
      </div>
      <div class="card saldo-card">
        <h3>Investimentos</h3>
        <p id="total-investimentos" class="valor positivo">R$ 0,00</p>
      </div>
    </section>

    <section class="card historico-card">
      <h2>Histórico de Transações</h2>
      <ul id="lista-transacoes" class="lista"></ul>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
