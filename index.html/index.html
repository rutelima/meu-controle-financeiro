<!DOCTYPE html>
<html>
<head>
    <title>Meu Controle</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Nosso Dinheiro 💚</h1>
    <p>Resumo financeiro do casal</p>

    <!-- Área de Cadastro de Novas Transações -->
    <form class="formulario-transacao">
        <h2>Adicionar Transação</h2>
        
        <label for="descricao">Descrição:</label>
        <input type="text" id="descricao" placeholder="Ex: Mercado, Salário..." required>

        <label for="valor-input">Valor (R$):</label>
        <input type="number" id="valor-input" step="0.01" placeholder="0,00" required>

        <label for="tipo">Tipo:</label>
        <select id="tipo">
            <option value="entrada">Entrada</option>
            <option value="despesa">Despesa</option>
        </select>

        <button type="button" id="btn-adicionar">Adicionar</button>
    </form>

<!-- Cartão de Entradas -->
    <section>
        <h2>Entradas</h2>
        <p class="valor" id="valor-entradas">R$ 0,00</p>
    </section>

    <!-- Cartão de Despesas -->
    <section>
        <h2>Despesas</h2>
        <p class="valor saida" id="valor-despesas">R$ 0,00</p>
    </section>

    <!-- Cartão de Saldo Restante -->
    <section class="cartao-saldo">
        <h2>Saldo restante</h2>
        <p class="valor-saldo" id="valor-saldo">R$ 0,00</p>
    </section>

    <!-- Cartão de Investimentos -->
    <section>
        <h2>Investimentos</h2>
        <p class="valor">R$ 1.000,00</p>
    </section>

    <!-- Lista do Histórico de Transações -->
    <section class="historico-container">
        <h2>Histórico de Transações</h2>
        <ul id="lista-transacoes">
            <!-- As transações vão entrar aqui dinamicamente pelo JS -->
        </ul>
    </section>
<!-- O Script entra AQUI, antes de fechar o body -->
    <script src="script.js"></script>
</body>
</html>
